<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CMU Real World Map</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        
        #map {
            height: 100%;
            width: 100%;
            z-index: 1; /* Keep map behind UI elements */
        }

        /* Custom Scrollbar for sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Leaflet popup styling override */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }
        .leaflet-popup-close-button {
            color: #fff !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            margin-top: 4px;
            margin-right: 4px;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col md:flex-row">

    <!-- Sidebar / Data Panel -->
    <aside class="w-full md:w-[350px] lg:w-[400px] h-[40vh] md:h-full bg-white shadow-2xl flex flex-col z-20 relative flex-shrink-0">
        <!-- Header -->
        <div class="p-5 border-b border-gray-200 bg-gradient-to-br from-purple-800 to-indigo-700 text-white shadow-md relative overflow-hidden">
            <!-- Decorative background circle -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full blur-xl"></div>
            <h1 class="text-2xl font-bold tracking-tight mb-1 relative z-10">แผนที่มหาวิทยาลัยเชียงใหม่</h1>
            <p class="text-sm text-purple-100 font-light flex items-center relative z-10">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                Real World Coordinates
            </p>
        </div>

        <!-- Search Bar -->
        <div class="p-4 border-b border-gray-100 bg-gray-50">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="ค้นหาสถานที่, คณะ, หอพัก..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-700 text-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- Location List -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-3" id="locationList">
            <!-- List items will be populated by JS -->
        </div>
        
        <!-- Dev Helper (Coordinate display) -->
        <div class="p-3 bg-purple-50 border-t border-purple-100 text-xs text-purple-700 text-center flex justify-between items-center">
            <span id="coordDisplay">คลิกบนแผนที่เพื่อดึงพิกัด GPS</span>
            <button onclick="copyCoords()" id="copyBtn" class="hidden bg-purple-200 hover:bg-purple-300 text-purple-800 px-2 py-1 rounded transition-colors font-medium">Copy</button>
        </div>
    </aside>

    <!-- Map Area -->
    <main class="w-full flex-1 h-[60vh] md:h-full relative bg-gray-200">
        <div id="map"></div>
        
        <!-- Crosshair for center reference (Optional, helps users know center) -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center z-[1000] opacity-0 transition-opacity" id="crosshair">
            <div class="w-4 h-4 border-2 border-gray-800 rounded-full relative">
                <div class="absolute top-1/2 left-1/2 w-1 h-1 bg-gray-800 rounded-full transform -translate-x-1/2 -translate-y-1/2"></div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        /**
         * ข้อมูลสถานที่ (Real GPS Coordinates)
         * พิกัด (lat, lng) สามารถหาได้จาก Google Maps 
         * โดยคลิกขวาที่สถานที่บน Google Maps แล้วเลือก Copy พิกัด
         */
        const mapData = [
            // --- หมวดคณะ (Faculties) ---
            { id: "F01", name: "คณะวิทยาศาสตร์", category: "faculty", lat: 18.801642, lng: 98.954868, img: "https://placehold.co/400x200/9333ea/ffffff?text=Science+CMU" },
            { id: "F02", name: "คณะวิศวกรรมศาสตร์", category: "faculty", lat: 18.795273, lng: 98.952802, img: "https://placehold.co/400x200/9333ea/ffffff?text=Engineering+CMU" },
            { id: "F03", name: "คณะนิติศาสตร์", category: "faculty", lat: 18.802066, lng: 98.948270, img: "https://placehold.co/400x200/9333ea/ffffff?text=Law+CMU" },
            { id: "F04", name: "คณะบริหารธุรกิจ", category: "faculty", lat: 18.794420, lng: 98.956328, img: "https://placehold.co/400x200/9333ea/ffffff?text=Business+CMU" },
            { id: "F05", name: "คณะเกษตรศาสตร์", category: "faculty", lat: 18.794692, lng: 98.961053, img: "https://placehold.co/400x200/9333ea/ffffff?text=Agriculture+CMU" },
            { id: "F06", name: "คณะแพทยศาสตร์ (รพ.มหาราชฯ)", category: "faculty", lat: 18.790382, lng: 98.974413, img: "https://placehold.co/400x200/9333ea/ffffff?text=Medicine+CMU" },
            
            // --- สถานที่สำคัญ (Landmarks) ---
            { id: "L01", name: "อ่างแก้ว", category: "landmark", lat: 18.806653, lng: 98.947814, img: "https://placehold.co/400x200/10b981/ffffff?text=Ang+Kaew" },
            { id: "L02", name: "ศาลาธรรม", category: "landmark", lat: 18.804825, lng: 98.954605, img: "https://placehold.co/400x200/10b981/ffffff?text=Sala+Dham" },
            { id: "L03", name: "ประตูหน้า มช.", category: "landmark", lat: 18.807865, lng: 98.954504, img: "https://placehold.co/400x200/10b981/ffffff?text=Main+Gate" },
            { id: "L04", name: "ศาลาอ่างแก้ว", category: "landmark", lat: 18.805566, lng: 98.948227, img: "https://placehold.co/400x200/10b981/ffffff?text=Sala+Ang+Kaew" },
            
            // --- บริการและอื่นๆ (Services) ---
            { id: "S01", name: "สำนักหอสมุด มช.", category: "service", lat: 18.799719, lng: 98.950796, img: "https://placehold.co/400x200/3b82f6/ffffff?text=Main+Library" },
            { id: "S02", name: "ตลาดร่มสัก (กาดฝายหิน)", category: "service", lat: 18.794711, lng: 98.949015, img: "https://placehold.co/400x200/3b82f6/ffffff?text=Kad+Faihin" },
            { id: "S03", name: "ศูนย์อาหาร อมช.", category: "service", lat: 18.802162, lng: 98.952575, img: "https://placehold.co/400x200/3b82f6/ffffff?text=CMU+Canteen" }
        ];

        let currentClickedCoord = "";

        // 1. กำหนดค่าเริ่มต้นสำหรับแผนที่โลกจริง
        // ตั้ง Center ไปที่กลาง มช. (ประมาณหอสมุด) และซูมระดับ 15
        const map = L.map('map', {
            center: [18.8000, 98.9520],
            zoom: 15,
            zoomControl: false // ปิดตัวเริ่มต้น เพื่อสร้างใหม่ไว้ตำแหน่งอื่น
        });

        // ย้ายปุ่มซูมไปไว้ขวาล่าง
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. โหลดแผนที่จาก OpenStreetMap (ฟรีและเสถียร)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markers = [];
        const locationListEl = document.getElementById('locationList');

        // หมวดหมู่และสี
        const categoryConfig = {
            faculty: { color: '#9333ea', icon: '🎓', label: 'คณะ' },
            landmark: { color: '#10b981', icon: '📸', label: 'สถานที่สำคัญ' },
            service: { color: '#3b82f6', icon: '🍽️', label: 'บริการ/ทั่วไป' }
        };

        // วนลูปสร้างหมุด (Markers) และรายการใน Sidebar
        mapData.forEach((loc, index) => {
            const config = categoryConfig[loc.category] || { color: '#6b7280', icon: '📍', label: 'ทั่วไป' };
            
            // 1. สร้าง Custom Marker Icon โดยใช้ HTML
            const markerHtmlStyles = `
                background-color: ${config.color};
                width: 32px;
                height: 32px;
                display: block;
                left: -16px;
                top: -32px;
                position: relative;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                border: 2px solid white;
                box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            const iconHtml = `<div style="transform: rotate(45deg); font-size: 14px;">${config.icon}</div>`;
            
            const customIcon = L.divIcon({
                className: 'custom-pin-real',
                html: `<span style="${markerHtmlStyles}">${iconHtml}</span>`
            });

            // 2. ปักหมุดลงบนแผนที่
            const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).addTo(map);
            
            // 3. สร้าง Popup สวยๆ แบบมีการ์ด
            const popupContent = `
                <div class="bg-white">
                    <div class="h-24 w-full bg-cover bg-center" style="background-image: url('${loc.img}');"></div>
                    <div class="p-4">
                        <span class="inline-block px-2 py-1 bg-gray-100 text-xs font-semibold rounded-full mb-2" style="color: ${config.color}">
                            ${config.label}
                        </span>
                        <h3 class="font-bold text-lg text-gray-800 mb-1 leading-tight">${loc.name}</h3>
                        <div class="mt-3 flex gap-2">
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}" target="_blank" 
                               class="flex-1 text-center bg-blue-50 hover:bg-blue-100 text-blue-600 py-1.5 rounded text-sm font-medium transition-colors">
                               นำทาง (Google Maps)
                            </a>
                        </div>
                    </div>
                </div>
            `;
            marker.bindPopup(popupContent);
            
            // เก็บข้อมูลไว้สำหรับการค้นหา
            markers.push({ data: loc, marker: marker });

            // 4. สร้างรายการใน Sidebar
            const listItem = document.createElement('div');
            listItem.className = 'location-item p-3 mb-2 rounded-xl cursor-pointer hover:bg-gray-50 transition-all border border-transparent hover:border-gray-200 hover:shadow-sm bg-white';
            listItem.innerHTML = `
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center shadow-sm flex-shrink-0 text-lg" style="background-color: ${config.color}20; color: ${config.color}">
                        ${config.icon}
                    </div>
                    <div class="ml-3 flex-1">
                        <h4 class="font-semibold text-gray-800 text-sm leading-tight">${loc.name}</h4>
                        <p class="text-xs text-gray-500 mt-0.5">${config.label}</p>
                    </div>
                </div>
            `;
            
            // เมื่อคลิกที่รายการใน Sidebar ให้ลอยไปหาตำแหน่งนั้น
            listItem.addEventListener('click', () => {
                // Fly to location
                map.flyTo([loc.lat, loc.lng], 17, { 
                    duration: 1.5,
                    easeLinearity: 0.25
                });
                
                // Open popup after flying
                setTimeout(() => {
                    marker.openPopup();
                }, 1500);

                // Highlight active item
                document.querySelectorAll('.location-item').forEach(el => {
                    el.classList.remove('ring-2', 'ring-purple-400', 'bg-purple-50');
                });
                listItem.classList.add('ring-2', 'ring-purple-400', 'bg-purple-50');
            });
            
            locationListEl.appendChild(listItem);
        });

        // ฟังก์ชันค้นหา (Search)
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const listItems = locationListEl.getElementsByClassName('location-item');
            
            mapData.forEach((loc, index) => {
                const textMatch = loc.name.toLowerCase().includes(searchTerm) || loc.category.toLowerCase().includes(searchTerm);
                
                // ซ่อน/แสดง รายการใน Sidebar
                if (textMatch) {
                    listItems[index].style.display = 'block';
                    if (!map.hasLayer(markers[index].marker)) {
                        map.addLayer(markers[index].marker);
                    }
                } else {
                    listItems[index].style.display = 'none';
                    if (map.hasLayer(markers[index].marker)) {
                        map.removeLayer(markers[index].marker);
                    }
                    markers[index].marker.closePopup();
                }
            });
        });

        // -----------------------------------------------------------------
        // เครื่องมือสำหรับนักพัฒนา (Developer Helper) 
        // -----------------------------------------------------------------
        const coordDisplay = document.getElementById('coordDisplay');
        const copyBtn = document.getElementById('copyBtn');

        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            
            currentClickedCoord = `lat: ${lat}, lng: ${lng}`;
            coordDisplay.innerHTML = `พิกัด: <span class="font-mono font-bold">${currentClickedCoord}</span>`;
            copyBtn.classList.remove('hidden');
            
            // Console log format ready to be pasted into mapData array
            console.log(`{ id: "NEW", name: "New Location", category: "faculty", lat: ${lat}, lng: ${lng}, img: "https://placehold.co/400x200/9333ea/ffffff?text=Image" },`);
        });

        // ฟังก์ชัน Copy พิกัด
        window.copyCoords = function() {
            if(currentClickedCoord) {
                // Using modern clipboard API with fallback
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(currentClickedCoord);
                } else {
                    // Fallback for iframe environments
                    const textArea = document.createElement("textarea");
                    textArea.value = currentClickedCoord;
                    textArea.style.position = "fixed";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                    } catch (err) {
                        console.error('Failed to copy', err);
                    }
                    document.body.removeChild(textArea);
                }
                
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                copyBtn.classList.add('bg-green-200', 'text-green-800');
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.classList.remove('bg-green-200', 'text-green-800');
                }, 2000);
            }
        }
        
        // Adjust map size correctly when window is resized or on mobile
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
        
        // Fix for initial loading inside flex containers
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

    </script>
</body>
</html>
